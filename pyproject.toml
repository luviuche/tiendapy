[project]
name = "tiendapy"
version = "0.1.0"
description = "Aplicacion de consola para el control de inventario y ventas de una tienda de barrio"
readme = "README.md"
authors = [
    { name = "luviuche", email = "lmvm.zzz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "tabulate>=0.10.0",
]

[project.scripts]
tiendapy = "tiendapy.main:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
